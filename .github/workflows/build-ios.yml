name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build for Device (Release)
        id: build_device
        run: |
          xcodebuild \
            -project ApexGameOptimizer.xcodeproj \
            -scheme ApexGameOptimizer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CLANG_CXX_LANGUAGE_STANDARD="c++20" \
            CLANG_CXX_LIBRARY="libc++" 2>&1 | tee build_device.log
          
          echo "=== BUILT_PRODUCTS_DIR ==="
          grep "BUILT_PRODUCTS_DIR" build_device.log | tail -1 || true
          
          echo "=== Build folder tree ==="
          find ./DerivedData/Build -maxdepth 4 -type d 2>/dev/null || true
          
          echo "=== All .app files ==="
          find ./DerivedData -name "*.app" 2>/dev/null || true
          
          echo "=== All .ipa files ==="
          find ./DerivedData -name "*.ipa" 2>/dev/null || true
          
          echo "=== All Products ==="
          find ./DerivedData/Build/Products -type f 2>/dev/null | head -30 || true

      - name: Build for Simulator
        id: build_sim
        run: |
          xcodebuild \
            -project ApexGameOptimizer.xcodeproj \
            -scheme ApexGameOptimizer \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath ./DerivedDataSim \
            CLANG_CXX_LANGUAGE_STANDARD="c++20" \
            CLANG_CXX_LIBRARY="libc++" 2>&1 | tee build_sim.log
          
          echo "=== BUILT_PRODUCTS_DIR ==="
          grep "BUILT_PRODUCTS_DIR" build_sim.log | tail -1 || true
          
          echo "=== Build folder tree ==="
          find ./DerivedDataSim/Build -maxdepth 4 -type d 2>/dev/null || true
          
          echo "=== All .app files ==="
          find ./DerivedDataSim -name "*.app" 2>/dev/null || true
          
          echo "=== All Products ==="
          find ./DerivedDataSim/Build/Products -type f 2>/dev/null | head -30 || true

      - name: Package output
        run: |
          mkdir -p output
          
          # Try device build first
          echo "=== Looking for device .app ==="
          find ./DerivedData -name "ApexGameOptimizer.app" 2>/dev/null || true
          DEV=$(find ./DerivedData -name "ApexGameOptimizer.app" 2>/dev/null | head -1 || true)
          if [ -n "$DEV" ]; then
            cp -r "$DEV" output/
            echo "COPIED DEVICE: $DEV"
          fi
          
          # Try simulator build
          echo "=== Looking for simulator .app ==="
          find ./DerivedDataSim -name "ApexGameOptimizer.app" 2>/dev/null || true
          SIM=$(find ./DerivedDataSim -name "ApexGameOptimizer.app" 2>/dev/null | head -1 || true)
          if [ -n "$SIM" ]; then
            cp -r "$SIM" output/
            echo "COPIED SIMULATOR: $SIM"
          fi
          
          # Fallback: copy Products directory
          echo "=== Fallback: copy Products ==="
          find ./DerivedData/Build/Products -type f -name "*.app" 2>/dev/null || true
          find ./DerivedDataSim/Build/Products -type f -name "*.app" 2>/dev/null || true
          PROD=$(find ./DerivedData/Build/Products -name "*.app" 2>/dev/null | head -1 || true)
          if [ -z "$DEV" ] && [ -n "$PROD" ]; then
            cp -r "$PROD" output/
            echo "COPIED FROM PRODUCTS: $PROD"
          fi
          PROD_SIM=$(find ./DerivedDataSim/Build/Products -name "*.app" 2>/dev/null | head -1 || true)
          if [ -z "$SIM" ] && [ -n "$PROD_SIM" ]; then
            cp -r "$PROD_SIM" output/
            echo "COPIED FROM PRODUCTS SIM: $PROD_SIM"
          fi
          
          echo "=== OUTPUT ==="
          find output -type f 2>/dev/null || true
          ls -la output/ 2>/dev/null || true

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApexGameOptimizer-iOS
          path: output/
          retention-days: 30
          if-no-files-found: warn
