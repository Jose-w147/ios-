name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Remove old project
        run: rm -rf ApexGameOptimizer.xcodeproj || true

      - name: Generate Project
        run: xcodegen generate --spec project.yml

      - name: Build and save full log
        run: |
          xcodebuild \
            -project ApexGameOptimizer.xcodeproj \
            -scheme ApexGameOptimizer \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee full_build.log || true
          
          echo "BUILD_DONE" >> full_build.log

      - name: Post log to Gist
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = fs.readFileSync('full_build.log', 'utf8');
            
            // Truncate to last 60000 chars to fit Gist limits
            if (log.length > 60000) {
              log = '...TRUNCATED...\n' + log.slice(-60000);
            }
            
            // Extract errors
            const lines = log.split('\n');
            const errors = lines.filter(l => /error:|fatal:|BUILD FAILED|ld:|linker/i.test(l));
            const last50 = lines.slice(-50).join('\n');
            
            const summary = `## Build #${context.runNumber}\n\n` +
              `### Errors found: ${errors.length}\n` +
              '```\n' + errors.slice(0, 50).join('\n') + '\n```\n\n' +
              `### Last 50 lines\n` +
              '```\n' + last50 + '\n```\n\n' +
              `### Full log (last 60KB)\n` +
              '```\n' + log + '\n```';
            
            await github.rest.gists.create({
              description: `iOS Build #${context.runNumber} - ${new Date().toISOString()}`,
              public: true,
              files: {
                [`build-${context.runNumber}.md`]: { content: summary }
              }
            }).then(r => {
              console.log('GIST_URL=' + r.data.html_url);
              core.exportVariable('GIST_URL', r.data.html_url);
            });

      - name: Show Gist URL
        if: always()
        run: echo "Check logs at: $GIST_URL"

      - name: Find .app
        if: always()
        run: |
          find ./DerivedData -name "*.app" 2>/dev/null || echo "No .app"
          find ./DerivedData/Build/Products -type d 2>/dev/null | head -20 || echo "No products"

      - name: Package IPA
        if: always()
        run: |
          APP=$(find ./DerivedData -name "ApexGameOptimizer.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find ./DerivedData -name "*.app" -type d 2>/dev/null | head -1)
          fi
          if [ -n "$APP" ]; then
            echo "Found: $APP"
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r ApexGameOptimizer.ipa Payload/
            ls -lh ApexGameOptimizer.ipa
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApexGameOptimizer-iOS
          path: ApexGameOptimizer.ipa
          retention-days: 30
          if-no-files-found: warn
