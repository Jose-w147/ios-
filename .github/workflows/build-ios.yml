name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build for Device (Release)
        run: |
          xcodebuild \
            -project ApexGameOptimizer.xcodeproj \
            -scheme ApexGameOptimizer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CLANG_CXX_LANGUAGE_STANDARD="c++20" \
            CLANG_CXX_LIBRARY="libc++" 2>&1 | tail -200

      - name: Package app
        run: |
          echo "=== Full DerivedData tree ==="
          find ./DerivedData -maxdepth 6 -type d 2>/dev/null
          
          echo "=== Finding all .app bundles ==="
          find ./DerivedData -name "*.app" -type d 2>/dev/null
          
          mkdir -p output
          
          # Try to find any .app
          APP=$(find ./DerivedData -name "*.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            cp -r "$APP" output/
            echo "Copied: $APP"
          else
            # Fallback: copy Products directory
            PRODUCTS=$(find ./DerivedData -name "Products" -type d 2>/dev/null | head -1)
            if [ -n "$PRODUCTS" ]; then
              cp -r "$PRODUCTS"/* output/ 2>/dev/null
              echo "Copied Products: $PRODUCTS"
            fi
          fi
          
          echo "=== Output contents ==="
          find output -type f | head -20

      - name: Upload output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApexGameOptimizer-iOS
          path: output/
          retention-days: 30
          if-no-files-found: warn
