name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: xcodegen generate --spec project.yml

      - name: List simulators
        run: xcrun simctl list devices available | grep -i iphone | head -10

      - name: Build
        run: |
          xcodebuild \
            -project ApexGameOptimizer.xcodeproj \
            -scheme ApexGameOptimizer \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1

      - name: Find .app
        if: always()
        run: |
          echo "=== ALL .app ==="
          find ./DerivedData -name "*.app" 2>/dev/null || echo "none"
          echo "=== Products ==="
          find ./DerivedData/Build/Products -type d 2>/dev/null | head -30 || echo "none"

      - name: Package IPA
        if: always()
        run: |
          APP=$(find ./DerivedData -name "ApexGameOptimizer.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "Found: $APP"
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r ApexGameOptimizer.ipa Payload/
            ls -lh ApexGameOptimizer.ipa
          else
            echo "No .app - trying all apps"
            APP2=$(find ./DerivedData -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP2" ]; then
              echo "Found generic: $APP2"
              mkdir -p Payload
              cp -r "$APP2" Payload/
              zip -r ApexGameOptimizer.ipa Payload/
              ls -lh ApexGameOptimizer.ipa
            fi
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApexGameOptimizer-iOS
          path: ApexGameOptimizer.ipa
          retention-days: 30
          if-no-files-found: warn
