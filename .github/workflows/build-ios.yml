name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build for Simulator
        run: |
          xcodebuild \
            -project ApexGameOptimizer.xcodeproj \
            -scheme ApexGameOptimizer \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath ./DerivedData \
            build > build.log 2>&1 || true
          
          if grep -q "BUILD SUCCEEDED" build.log; then
            echo "BUILD SUCCEEDED"
          else
            echo "BUILD FAILED"
            grep -i "error:" build.log | head -30
            tail -30 build.log
            exit 1
          fi

      - name: Find and Package .app
        run: |
          echo "=== Searching DerivedData ==="
          find ./DerivedData -name "*.app" -type d 2>/dev/null || true
          
          APP=$(find ./DerivedData -name "ApexGameOptimizer.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "NO .app FOUND"
            echo "Listing DerivedData structure:"
            find ./DerivedData/Build/Products -type d 2>/dev/null || true
            exit 1
          fi
          
          echo "Found: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r ApexGameOptimizer.ipa Payload/
          echo "=== IPA ==="
          ls -lh ApexGameOptimizer.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApexGameOptimizer-iOS
          path: |
            ApexGameOptimizer.ipa
            build.log
          retention-days: 30
          if-no-files-found: warn
