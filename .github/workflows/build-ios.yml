name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build Simulator .app
        run: |
          xcodebuild \
            -project ApexGameOptimizer.xcodeproj \
            -scheme ApexGameOptimizer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CLANG_CXX_LANGUAGE_STANDARD="c++20" \
            CLANG_CXX_LIBRARY="libc++" \
            clean build 2>&1 | tail -30

      - name: Find .app
        run: |
          echo "=== Full build tree ==="
          find ./build -name "*.app" 2>/dev/null || echo "no .app found"
          echo "=== Products ==="
          find ./build/Build/Products -type f 2>/dev/null | head -20 || echo "no products"
          echo "=== All dirs ==="
          find ./build/Build/Products -type d 2>/dev/null || echo "no dirs"

      - name: Create IPA
        run: |
          mkdir -p Payload
          APP=$(find ./build -name "ApexGameOptimizer.app" -type d 2>/dev/null | head -1 || true)
          if [ -n "$APP" ]; then
            cp -r "$APP" Payload/
            zip -r ApexGameOptimizer.ipa Payload/
            echo "IPA CREATED: $(ls -lh ApexGameOptimizer.ipa)"
          else
            echo "NO .app FOUND - listing full tree:"
            find ./build -type f 2>/dev/null | head -50
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApexGameOptimizer-iOS
          path: |
            ApexGameOptimizer.ipa
            Payload/
          retention-days: 30
          if-no-files-found: warn
