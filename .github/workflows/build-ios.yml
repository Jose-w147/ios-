name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml 2>&1

      - name: Show project structure
        run: |
          ls -la *.xcodeproj 2>/dev/null || echo "No xcodeproj"
          ls -la ApexGameOptimizer/ 2>/dev/null || echo "No ApexGameOptimizer dir"
          ls -la Native/src/ 2>/dev/null || echo "No Native/src dir"

      - name: Build
        run: |
          xcodebuild \
            -project ApexGameOptimizer.xcodeproj \
            -scheme ApexGameOptimizer \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath ./DerivedData \
            build 2>&1

      - name: Find .app
        if: always()
        run: |
          find ./DerivedData -name "*.app" 2>/dev/null || echo "No .app found"
          find ./DerivedData/Build/Products -type d 2>/dev/null | head -20 || echo "No products dir"
