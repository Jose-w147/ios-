name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build for Simulator
        run: |
          xcodebuild \
            -project ApexGameOptimizer.xcodeproj \
            -scheme ApexGameOptimizer \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath ./DerivedData \
            build 2>&1 | tee build.log
          echo "=== Build errors ==="
          grep -i "error:" build.log | head -30 || echo "No errors found"

      - name: Find and Package .app
        run: |
          echo "=== Searching for .app ==="
          APP=$(find ./DerivedData -name "ApexGameOptimizer.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found"
            find ./DerivedData -maxdepth 6 -type d 2>/dev/null
            exit 1
          fi
          echo "Found: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r ApexGameOptimizer.ipa Payload/
          echo "=== IPA Created ==="
          ls -lh ApexGameOptimizer.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApexGameOptimizer-iOS
          path: |
            ApexGameOptimizer.ipa
            build.log
          retention-days: 30
          if-no-files-found: warn
