name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build
        shell: zsh
        run: |
          xcodebuild \
            -project ApexGameOptimizer.xcodeproj \
            -scheme ApexGameOptimizer \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./DerivedData \
            build | tee build.log; return $pipestatus[1]

      - name: Show build errors
        if: always()
        run: |
          echo "=== ERRORS ==="
          grep -i "error:" build.log 2>/dev/null | head -50 || echo "No error: lines"
          echo "=== TAIL ==="
          tail -80 build.log 2>/dev/null || echo "No build.log"

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: warn

      - name: Find and Package
        if: always()
        run: |
          APP=$(find ./DerivedData -name "*.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "Found: $APP"
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r ApexGameOptimizer.ipa Payload/
            ls -lh ApexGameOptimizer.ipa
          else
            echo "No .app found"
            find ./DerivedData -type d -maxdepth 5 2>/dev/null | head -30 || true
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApexGameOptimizer-iOS
          path: ApexGameOptimizer.ipa
          retention-days: 30
          if-no-files-found: warn
