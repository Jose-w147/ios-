name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build for Simulator
        run: |
          xcodebuild \
            -project ApexGameOptimizer.xcodeproj \
            -scheme ApexGameOptimizer \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./DerivedData \
            build 2>&1 | tee build.log
          echo "EXIT CODE: $?"

      - name: Debug DerivedData
        if: always()
        run: |
          echo "=== DerivedData root ==="
          ls -la ./DerivedData/ 2>/dev/null || echo "No DerivedData"
          echo "=== Build dir ==="
          find ./DerivedData/Build -maxdepth 3 -type d 2>/dev/null | head -30
          echo "=== All .app files ==="
          find ./DerivedData -name "*.app" -type d 2>/dev/null
          echo "=== All .app bundles ==="
          find ./DerivedData -name "*.app" 2>/dev/null
          echo "=== Build log errors ==="
          grep -i "error:" build.log 2>/dev/null | head -20 || echo "None"
          echo "=== Build log warnings ==="
          grep -i "warning:" build.log 2>/dev/null | tail -10 || echo "None"

      - name: Package IPA
        if: always()
        run: |
          APP=$(find ./DerivedData -name "ApexGameOptimizer.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "NO .app FOUND - skipping IPA"
            exit 0
          fi
          echo "Found: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r ApexGameOptimizer.ipa Payload/
          ls -lh ApexGameOptimizer.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApexGameOptimizer-iOS
          path: |
            ApexGameOptimizer.ipa
            build.log
          retention-days: 30
          if-no-files-found: warn
