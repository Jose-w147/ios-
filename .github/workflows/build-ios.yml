name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build for Simulator
        run: |
          xcodebuild \
            -project ApexGameOptimizer.xcodeproj \
            -scheme ApexGameOptimizer \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath ./DerivedDataSim \
            CLANG_CXX_LANGUAGE_STANDARD="c++20" \
            CLANG_CXX_LIBRARY="libc++" 2>&1 | tail -50

      - name: Locate .app bundle
        run: |
          echo "=== FULL DerivedDataSim tree ==="
          find ./DerivedDataSim -type d -name "*.app" 2>/dev/null
          find ./DerivedDataSim -type f -name "*.app" 2>/dev/null
          echo "=== Build products ==="
          find ./DerivedDataSim/Build -type f 2>/dev/null | head -50
          echo "=== BUILT_PRODUCTS_DIR ==="
          find ./DerivedDataSim/Build/Products -type d 2>/dev/null | head -30

      - name: Package
        run: |
          mkdir -p output
          # List all .app paths
          find ./DerivedDataSim -type d -name "*.app" 2>/dev/null | while read app; do
            echo "Found app bundle dir: $app"
            cp -r "$app" output/
          done
          find ./DerivedDataSim -type f -name "*.app" 2>/dev/null | while read app; do
            echo "Found app bundle file: $app"
            cp "$app" output/
          done
          # Also try to find via Products path
          PRODUCTS_DIR=$(find ./DerivedDataSim/Build/Products -maxdepth 1 -type d 2>/dev/null | tail -1)
          if [ -n "$PRODUCTS_DIR" ]; then
            echo "Products dir: $PRODUCTS_DIR"
            ls -la "$PRODUCTS_DIR/"
            cp -r "$PRODUCTS_DIR"/* output/ 2>/dev/null || true
          fi
          echo "=== Output ==="
          ls -laR output/ 2>/dev/null

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApexGameOptimizer-iOS
          path: output/
          retention-days: 30
          if-no-files-found: warn
