name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build for Device (Release)
        run: |
          xcodebuild \
            -project ApexGameOptimizer.xcodeproj \
            -scheme ApexGameOptimizer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CLANG_CXX_LANGUAGE_STANDARD="c++20" \
            CLANG_CXX_LIBRARY="libc++" 2>&1 | tail -200

      - name: Create IPA
        run: |
          mkdir -p Payload
          
          echo "=== Searching for .app ==="
          find ./DerivedData -name "*.app" -type d 2>/dev/null
          
          APP_PATH=$(find ./DerivedData -name "ApexGameOptimizer.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "No .app found. Listing DerivedData:"
            find ./DerivedData -type d | head -30
            echo "BUILD FAILED: no .app bundle found"
            exit 1
          fi
          
          echo "Found: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r ApexGameOptimizer.ipa Payload/
          echo "=== IPA Created ==="
          ls -la ApexGameOptimizer.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApexGameOptimizer-iOS
          path: ApexGameOptimizer.ipa
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "========================================"
          echo "  BUILD iOS STATUS"
          echo "========================================"
          echo "  iPhone 8+ (A11 Bionic, arm64)"
          echo "  XcodeGen + Xcode 15 + C++20"
          echo "========================================"
          if [ -f "ApexGameOptimizer.ipa" ]; then
            echo "  STATUS: SUCCESS"
            echo "  IPA: $(ls -lh ApexGameOptimizer.ipa | awk '{print $5}')"
          else
            echo "  STATUS: PARTIAL (C++ compiled, packaging failed)"
          fi
          echo "========================================"
