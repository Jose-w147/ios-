name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: xcodegen generate --spec project.yml

      - name: Build
        run: |
          xcodebuild \
            -project ApexGameOptimizer.xcodeproj \
            -scheme ApexGameOptimizer \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1

      - name: List all products
        if: always()
        run: |
          echo "=== ALL files in DerivedData ==="
          find ./DerivedData -type f -name "*.app" -o -name "*.appex" -o -name "*.ipa" 2>/dev/null || echo "none"
          echo "=== Products directory ==="
          find ./DerivedData/Build/Products -type f 2>/dev/null | head -30 || echo "none"
          echo "=== Build directory ==="
          find ./DerivedData/Build -maxdepth 1 -type d 2>/dev/null || echo "none"
          echo "=== ALL directories in Products ==="
          find ./DerivedData/Build/Products -type d 2>/dev/null || echo "none"

      - name: Package IPA
        if: always()
        run: |
          APP=$(find ./DerivedData -name "ApexGameOptimizer.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find ./DerivedData -name "*.app" -type d 2>/dev/null | head -1)
          fi
          if [ -n "$APP" ]; then
            echo "Found: $APP"
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r ApexGameOptimizer.ipa Payload/
            ls -lh ApexGameOptimizer.ipa
          else
            echo "NO .app FOUND"
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApexGameOptimizer-iOS
          path: ApexGameOptimizer.ipa
          retention-days: 30
          if-no-files-found: warn
